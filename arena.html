<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Floor Toronto - Audience Display</title>
  <link rel="stylesheet" href="app.css">
  <style>
    /* Audience Display: No Host Dock, Full Viewport Center */
    body {
      overflow: hidden;
    }
    .arena-grid {
      min-height: calc(100vh - 40px);
      margin-top: 10px;
    }
    .clue-screen {
      min-height: 520px;
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <main class="view-container active" style="max-width: 1600px; padding: 10px 24px;">
    <div class="arena-grid">
      <!-- Player 1 Podium (Cyan) -->
      <aside id="p1Podium" class="player-podium p1 active-turn">
        <div class="player-badge">Player 1</div>
        <h2 id="p1Name" class="player-name">Player 1</h2>

        <div id="p1TimerBox" class="timer-box">
          <div id="p1TimerDigits" class="timer-digits">45</div>
          <div class="timer-bar-container">
            <div id="p1TimerBar" class="timer-bar" style="width: 100%;"></div>
          </div>
        </div>

        <div id="p1Status" class="turn-status-indicator">ACTIVE TURN</div>
      </aside>

      <!-- Center Stage: The Floor Visual Clue -->
      <section class="center-stage">
        <div class="category-banner">
          <span id="categoryTitle" class="category-title">LANDMARKS OF TORONTO</span>
        </div>

        <!-- Visual Clue Display Screen (NO ANSWERS VISIBLE) -->
        <div class="clue-screen">
          <span id="clueCounter" class="clue-counter-badge">1 / 10</span>
          <img id="clueImage" class="clue-image" alt="Visual Clue" src="" />

          <!-- Starting Soon Screen (shown before duel starts) -->
          <div id="startingSoonOverlay" class="stage-overlay starting-soon-overlay">
            <div class="starting-soon-badge">DUEL PREPARED</div>
            <h1 class="starting-soon-title">STARTING SOON</h1>
            <p class="starting-soon-subtitle">Waiting for host to start duel...</p>
          </div>

          <!-- 3-Second Countdown Overlay -->
          <div id="countdownOverlay" class="stage-overlay countdown-overlay" style="display: none;">
            <div id="countdownNumber" class="countdown-digits">3</div>
            <div class="countdown-label">GET READY!</div>
          </div>

          <!-- Pass 3-Second Recovery Overlay (Prompt removed) -->
          <div id="passOverlay" class="stage-overlay pass-recovery-overlay" style="display: none;">
            <div class="pass-recovery-badge">↷ PASSED</div>
            <div class="pass-recovery-title">RECOVERING...</div>
            <div id="passRecoveryDigits" class="pass-recovery-digits">3s</div>
            <div class="pass-recovery-bar-container">
              <div id="passRecoveryBar" class="pass-recovery-bar" style="width: 100%;"></div>
            </div>
          </div>

          <!-- Flash overlay for Correct/Pass -->
          <div id="flashOverlay" class="flash-overlay">
            <span id="flashText" class="flash-text">CORRECT!</span>
          </div>
        </div>

        <div style="margin-top: 15px; color: var(--text-muted); font-size: 0.85rem; letter-spacing: 2px;">
          ★ THE FLOOR TORONTO DUEL ★
        </div>
      </section>

      <!-- Player 2 Podium (Crimson) -->
      <aside id="p2Podium" class="player-podium p2">
        <div class="player-badge">Player 2</div>
        <h2 id="p2Name" class="player-name">Player 2</h2>

        <div id="p2TimerBox" class="timer-box">
          <div id="p2TimerDigits" class="timer-digits">45</div>
          <div class="timer-bar-container">
            <div id="p2TimerBar" class="timer-bar" style="width: 100%;"></div>
          </div>
        </div>

        <div id="p2Status" class="turn-status-indicator">STANDBY</div>
      </aside>
    </div>
  </main>

  <!-- Victory Overlay -->
  <div id="victoryModal" class="modal-overlay">
    <div class="modal-card victory">
      <div style="font-size: 4rem; margin-bottom: 8px;">🏆</div>
      <h2 id="victoryWinnerName" class="victory-title">Player 1 Wins!</h2>
      <p id="victoryDetails" class="victory-subtitle">Time Expired</p>
    </div>
  </div>

  <script src="sound-engine.js"></script>
  <script>
    // Arena Display Synchronizer - Connected to SSE & BroadcastChannel
    const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('the-floor-toronto') : null;
    let isConnectedViaSse = false;
    let currentClueId = null;

    const el = {
      categoryTitle: document.getElementById('categoryTitle'),
      clueImage: document.getElementById('clueImage'),
      clueCounter: document.getElementById('clueCounter'),
      flashOverlay: document.getElementById('flashOverlay'),
      flashText: document.getElementById('flashText'),
      p1Podium: document.getElementById('p1Podium'),
      p1Name: document.getElementById('p1Name'),
      p1TimerBox: document.getElementById('p1TimerBox'),
      p1TimerDigits: document.getElementById('p1TimerDigits'),
      p1TimerBar: document.getElementById('p1TimerBar'),
      p1Status: document.getElementById('p1Status'),
      p2Podium: document.getElementById('p2Podium'),
      p2Name: document.getElementById('p2Name'),
      p2TimerBox: document.getElementById('p2TimerBox'),
      p2TimerDigits: document.getElementById('p2TimerDigits'),
      p2TimerBar: document.getElementById('p2TimerBar'),
      p2Status: document.getElementById('p2Status'),
      startingSoonOverlay: document.getElementById('startingSoonOverlay'),
      countdownOverlay: document.getElementById('countdownOverlay'),
      countdownNumber: document.getElementById('countdownNumber'),
      passOverlay: document.getElementById('passOverlay'),
      passRecoveryDigits: document.getElementById('passRecoveryDigits'),
      passRecoveryBar: document.getElementById('passRecoveryBar'),
      victoryModal: document.getElementById('victoryModal'),
      victoryWinnerName: document.getElementById('victoryWinnerName'),
      victoryDetails: document.getElementById('victoryDetails')
    };

    function formatTime(seconds) {
      if (seconds <= 0) return "0.0";
      if (seconds < 10) return seconds.toFixed(1);
      return Math.ceil(seconds).toString();
    }

    function flashScreen(text, className) {
      el.flashText.textContent = text;
      el.flashOverlay.className = `flash-overlay ${className}`;
      setTimeout(() => {
        el.flashOverlay.className = 'flash-overlay';
      }, 450);
    }

    function applyArenaState(d) {
      if (!d) return;

      // 1. Lightweight Timer Tick
      if (d.eventType === 'tick') {
        if (d.p1Time !== undefined) {
          el.p1TimerDigits.textContent = formatTime(d.p1Time);
          const p1Pct = Math.max(0, Math.min(100, (d.p1Time / 45) * 100));
          el.p1TimerBar.style.width = `${p1Pct}%`;
          if (d.p1Time <= 10 && d.p1Time > 0 && d.activePlayer === 1) {
            el.p1TimerBox.classList.add('urgent');
          } else {
            el.p1TimerBox.classList.remove('urgent');
          }
        }
        if (d.p2Time !== undefined) {
          el.p2TimerDigits.textContent = formatTime(d.p2Time);
          const p2Pct = Math.max(0, Math.min(100, (d.p2Time / 45) * 100));
          el.p2TimerBar.style.width = `${p2Pct}%`;
          if (d.p2Time <= 10 && d.p2Time > 0 && d.activePlayer === 2) {
            el.p2TimerBox.classList.add('urgent');
          } else {
            el.p2TimerBox.classList.remove('urgent');
          }
        }
        return;
      }

      // 2. Countdown Ticks
      if (d.eventType === 'countdown_start' || d.eventType === 'countdown_tick') {
        const val = d.countdownVal !== undefined ? d.countdownVal : 3;
        el.countdownNumber.textContent = val;
        el.countdownOverlay.style.display = 'flex';
        el.startingSoonOverlay.style.display = 'none';
        el.passOverlay.style.display = 'none';
        el.clueImage.style.display = 'none';
        if (window.soundEngine?.playCountdownBeep) {
          window.soundEngine.playCountdownBeep(false);
        }
        return;
      }

      // 3. Pass Recovery Ticks (Prompt removed for 3s)
      if (d.eventType === 'pass_start' || d.eventType === 'pass_tick') {
        const rem = d.passRemaining !== undefined ? d.passRemaining : 3;
        el.passRecoveryDigits.textContent = `${rem}s`;
        const pct = (rem / 3) * 100;
        el.passRecoveryBar.style.width = `${pct}%`;
        el.passOverlay.style.display = 'flex';
        el.clueImage.style.display = 'none';
        el.startingSoonOverlay.style.display = 'none';
        el.countdownOverlay.style.display = 'none';
        if (d.eventType === 'pass_start') {
          window.soundEngine?.playPass();
        }
        return;
      }

      // Sounds & Visual Flashes
      if (d.eventType === 'correct') {
        window.soundEngine?.playCorrect();
        flashScreen('CORRECT!', 'correct-flash');
      } else if (d.eventType === 'start') {
        if (window.soundEngine?.playCountdownBeep) {
          window.soundEngine.playCountdownBeep(true);
        }
      }

      // Overlays management for main states
      if (d.status === 'ready') {
        el.startingSoonOverlay.style.display = 'flex';
        el.countdownOverlay.style.display = 'none';
        el.passOverlay.style.display = 'none';
        el.clueImage.style.display = 'none';
      } else if (d.status === 'countdown') {
        el.startingSoonOverlay.style.display = 'none';
        el.countdownOverlay.style.display = 'flex';
        el.passOverlay.style.display = 'none';
        el.clueImage.style.display = 'none';
      } else if (d.isPassing) {
        el.startingSoonOverlay.style.display = 'none';
        el.countdownOverlay.style.display = 'none';
        el.passOverlay.style.display = 'flex';
        el.clueImage.style.display = 'none';
      } else {
        // running, paused, gameover
        el.startingSoonOverlay.style.display = 'none';
        el.countdownOverlay.style.display = 'none';
        el.passOverlay.style.display = 'none';
        el.clueImage.style.display = 'block';
      }

      if (d.title) el.categoryTitle.textContent = d.title.toUpperCase();
      if (d.p1?.name) el.p1Name.textContent = d.p1.name;
      if (d.p2?.name) el.p2Name.textContent = d.p2.name;

      // Active Turn
      if (d.activePlayer === 1) {
        el.p1Podium.classList.add('active-turn');
        el.p2Podium.classList.remove('active-turn');
        el.p1Status.textContent = 'ACTIVE TURN';
        el.p2Status.textContent = 'STANDBY';
      } else if (d.activePlayer === 2) {
        el.p2Podium.classList.add('active-turn');
        el.p1Podium.classList.remove('active-turn');
        el.p1Status.textContent = 'STANDBY';
        el.p2Status.textContent = 'ACTIVE TURN';
      }

      // Clue Image (Stable caching by promptId)
      const newImg = d.promptImage || (d.clue && d.clue.image);
      const newId = d.promptId || (d.clue && d.clue.id) || ('clue_' + d.clueIndex);
      if (newImg && currentClueId !== newId) {
        currentClueId = newId;
        el.clueImage.src = newImg;
      }
      if (d.clueIndex !== undefined && d.cluesCount) {
        el.clueCounter.textContent = `${d.clueIndex + 1} / ${d.cluesCount}`;
      }

      // Victory
      if (d.status === 'gameover' && d.winner) {
        const winnerName = d.winner === 1 ? (d.p1?.name || 'Player 1') : (d.p2?.name || 'Player 2');
        const remaining = formatTime(d.winner === 1 ? d.p1?.timeRemaining : d.p2?.timeRemaining);
        el.victoryWinnerName.textContent = `${winnerName} Wins!`;
        el.victoryDetails.textContent = `${winnerName} takes the floor with ${remaining}s remaining!`;
        el.victoryModal.classList.add('active');
      } else {
        el.victoryModal.classList.remove('active');
      }
    }

    // Connect to SSE Stream
    if (location.protocol.startsWith('http')) {
      const sse = new EventSource('/api/events');
      sse.onopen = () => { isConnectedViaSse = true; };
      sse.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          applyArenaState(data);
        } catch (e) {}
      };
      sse.onerror = () => { isConnectedViaSse = false; };
    }

    // BroadcastChannel Listener (offline file:// fallback only)
    if (channel) {
      channel.onmessage = (event) => {
        if (isConnectedViaSse) return;
        if (event.data && event.data.type === 'STATE_SYNC') {
          applyArenaState(event.data.payload);
        }
      };
    }
  </script>
</body>
</html>
